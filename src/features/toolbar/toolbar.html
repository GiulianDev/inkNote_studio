<!-- features/toolbar/toolbar.html
     Markup della feature toolbar v2 (mainbar + dock contestuali).
     Iniettato via `?raw` da toolbar.js tramite mountToolbar().
     Icone: Lucide (https://lucide.dev, MIT). Inline SVG, stroke currentColor. -->

<header id="mainHeader"
  class="bg-white/95 dark:bg-slate-900/95 border-b border-slate-300 dark:border-slate-800 px-2 py-2.5 flex items-center justify-between gap-2 z-30 shrink-0 shadow-sm transition-all duration-200">

  <!-- LEFT: back + titolo -->
  <div id="headerLeft" class="flex items-center space-x-2 shrink-0">
    <button id="backToLibraryBtn"
      class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-2 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
      title="Torna alla Libreria">
      <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
      </svg>
      <span class="hidden xl:inline">Libreria</span>
    </button>
    <div class="h-4 w-px bg-slate-300 dark:bg-slate-700 shrink-0 hidden md:block"></div>
    <div class="min-w-0">
      <input type="text" id="docTitle" value="Appunti Surface Pen"
        class="font-semibold text-sm bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-indigo-500 rounded px-1.5 py-0.5 outline-none w-24 md:w-32 lg:w-auto" />
      <div class="text-[11px] text-slate-500 dark:text-slate-400 font-medium flex items-center gap-1.5">
        <span id="pageCounterText">Pagina 1 di 1</span>
        <span>•</span>
        <span id="statusBadge" class="text-indigo-600 dark:text-indigo-400 font-medium">Salvato</span>
      </div>
    </div>
  </div>

  <!-- CENTER: 5 menu contestuali -->
  <div id="mainMenuBar" class="flex-1 flex justify-center items-center min-w-0 gap-0.5 px-2">
    <button class="main-menu-btn" data-menu="writing" id="menuBtn-writing" title="Scrittura">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
      </svg>
      <span class="main-menu-label">Scrittura</span>
    </button>
    <button class="main-menu-btn" data-menu="text" id="menuBtn-text" title="Testo">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="4 7 4 4 20 4 20 7"/>
        <line x1="9" x2="15" y1="20" y2="20"/>
        <line x1="12" x2="12" y1="4" y2="20"/>
      </svg>
      <span class="main-menu-label">Testo</span>
    </button>
    <button class="main-menu-btn" data-menu="selection" id="menuBtn-selection" title="Selezione">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 22a5 5 0 0 1-2-4"/>
        <path d="M3.3 14A6.8 6.8 0 0 1 2 10c0-4.4 4.5-8 10-8s10 3.6 10 8-4.5 8-10 8a12 12 0 0 1-5-1"/>
        <path d="M5 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
      </svg>
      <span class="main-menu-label">Selezione</span>
    </button>
    <button class="main-menu-btn" data-menu="shapes" id="menuBtn-shapes" title="Forme">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <circle cx="17.5" cy="17.5" r="3.5"/>
      </svg>
      <span class="main-menu-label">Forme</span>
    </button>
    <button class="main-menu-btn" data-menu="eraser" id="menuBtn-eraser" title="Gomma">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
        <path d="M22 21H7"/>
        <path d="m5 11 9 9"/>
      </svg>
      <span class="main-menu-label">Gomma</span>
    </button>
    <button class="main-menu-btn" data-menu="page" id="menuBtn-page" title="Foglio">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
        <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
        <path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>
      </svg>
      <span class="main-menu-label">Foglio</span>
    </button>
  </div>

    <!-- RIGHT: azioni -->
  <div id="headerRight" class="relative z-10 flex items-center space-x-1 shrink-0">
    <button id="toolbarMenuBtn"
      class="dock-icon-btn inline-flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95"
      title="Altri strumenti">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
      </svg>
    </button>
    <button id="compactExitBtn"
      class="dock-icon-btn inline-flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95"
      title="Schermo intero">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path id="compactIconExpand" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"/>
        <path id="compactIconReduce" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9M20.25 20.25h-4.5m4.5 0v-4.5m0 4.5L15 15" style="display:none;"/>
      </svg>
    </button>
    <button id="openSettingsBtnHeader"
      class="dock-icon-btn inline-flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95"
      title="Impostazioni">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <button id="themeToggleBtn"
      class="dock-icon-btn inline-flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-amber-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95"
      title="Tema chiaro/scuro">
      <svg class="ui-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
      <svg class="ui-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2"/><path d="M12 20v2"/>
        <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
        <path d="M2 12h2"/><path d="M20 12h2"/>
        <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </svg>
    </button>
    <button id="exportPdfBtn"
      class="dock-pill-btn inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 rounded-xl shadow-md transition active:scale-95"
      title="Esporta PDF">
      <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" x2="12" y1="15" y2="3"/>
      </svg>
      <span class="hidden lg:inline">PDF</span>
    </button>
  </div>
</header>

<!-- ============================================================
     DOCK CONTESTUALI
     Uno per menu. Nascosti di default, mostrati da toolbar.js.
     ============================================================ -->

<!-- DOCK SCRITTURA -->
<div id="dockWriting" class="context-dock hidden" data-menu="writing">
  <div class="context-dock-row">
    <!-- Tool writing -->
    <div class="context-dock-group">
      <button id="btnTool-pen" class="dock-tool-btn tool-btn" title="Stilografica">
        <svg class="ui-icon-dock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
        </svg>
      </button>
      <button id="btnTool-pencil" class="dock-tool-btn tool-btn" title="Matita">
        <svg class="ui-icon-dock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
          <path d="m15 5 4 4"/>
        </svg>
      </button>
      <button id="btnTool-marker" class="dock-tool-btn tool-btn" title="Pennarello">
        <svg class="ui-icon-dock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 19 7-7 3 3-7 7-3-3z"/>
          <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
          <path d="m2 2 7.586 7.586"/>
          <circle cx="11" cy="11" r="2"/>
        </svg>
      </button>
      <button id="btnTool-highlighter" class="dock-tool-btn tool-btn" title="Evidenziatore">
        <svg class="ui-icon-dock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 11-6 6v3h9l3-3"/>
          <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>
        </svg>
      </button>
    </div>

    <div class="context-dock-divider"></div>

    <!-- Palette colori -->
    <div id="colorPalette" class="context-dock-group">
      <button class="color-swatch dock-swatch rounded-full bg-slate-900 dark:bg-slate-100 border-2 border-white dark:border-slate-800 ring-2 ring-indigo-500 scale-105" data-color="#000000" title="Nero"></button>
      <button class="color-swatch dock-swatch rounded-full bg-blue-600 border-2 border-white dark:border-slate-800" data-color="#2563eb" title="Blu"></button>
      <button class="color-swatch dock-swatch rounded-full bg-emerald-600 border-2 border-white dark:border-slate-800" data-color="#059669" title="Verde"></button>
      <button class="color-swatch dock-swatch rounded-full bg-rose-600 border-2 border-white dark:border-slate-800" data-color="#e11d48" title="Rosso"></button>
      <button class="color-swatch dock-swatch rounded-full bg-amber-500 border-2 border-white dark:border-slate-800" data-color="#d97706" title="Arancio"></button>
      <div id="recentColorsContainer" class="hidden items-center space-x-1"></div>
      <input type="color" id="customColorPicker"
        class="dock-swatch rounded-full border-0 cursor-pointer p-0 bg-transparent"
        title="Colore personalizzato">
    </div>
  </div>

  <div class="context-dock-row">
    <!-- Spessore -->
    <div class="context-dock-group" title="Spessore tratto">
      <span class="context-dock-label">Spessore</span>
      <input type="range" id="strokeWidthSlider" min="1" max="25" value="3"
        class="dock-range accent-indigo-600 cursor-pointer">
      <span id="strokeWidthValue"
        class="text-[10px] font-semibold text-slate-600 dark:text-slate-300 w-4 text-center tabular-nums">3</span>
    </div>

    <div class="context-dock-divider"></div>

    <!-- Opacità (apre il popover colore) -->
    <div class="context-dock-group" title="Opacità">
      <span class="context-dock-label">Opacità</span>
      <button id="opacityBtn"
        class="text-xs font-semibold text-slate-700 dark:text-slate-200 px-2 py-1 rounded-lg bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 transition">
        <span id="opacityValue">100%</span>
      </button>
    </div>

    <div class="context-dock-divider"></div>

    <!-- Smoothing -->
    <div class="context-dock-group" title="Levigatura del tratto">
      <span class="context-dock-label">Levigatura</span>
      <input type="range" id="smoothingSlider" min="0" max="100" value="50"
        class="dock-range accent-indigo-600 cursor-pointer">
      <span id="smoothingValue"
        class="text-[10px] font-semibold text-slate-600 dark:text-slate-300 w-4 text-center tabular-nums">50</span>
    </div>
  </div>

  <!-- Riga stile tratto (nascosta per highlighter, visibile per pen/pencil/marker) -->
  <div class="context-dock-row" id="strokeStyleRow">
    <div class="context-dock-group" title="Tipo di tratto">
      <span class="context-dock-label">Stile</span>
      <button class="stroke-style-btn" data-style="solid" title="Solido">
        <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
          <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="stroke-style-btn" data-style="dashed" title="Tratteggiato">
        <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
          <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
        </svg>
      </button>
      <button class="stroke-style-btn" data-style="dashed-large" title="Tratteggio largo">
        <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
          <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="9 5"/>
        </svg>
      </button>
      <button class="stroke-style-btn" data-style="dotted" title="Punteggiato">
        <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
          <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 5"/>
        </svg>
      </button>
      <button class="stroke-style-btn" data-style="dash-dot" title="Tratto-punto">
        <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
          <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 3 0.1 3"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- DOCK TESTO -->
<div id="dockText" class="context-dock hidden" data-menu="text">
  <div class="context-dock-row">
    <!-- Font -->
    <div class="context-dock-group" title="Carattere">
      <span class="context-dock-label">Font</span>
      <select id="textFontSelect" class="dock-select">
        <option value="sans">Sans-serif</option>
        <option value="serif">Serif</option>
        <option value="mono">Monospace</option>
        <option value="hand">Calligrafico</option>
      </select>
    </div>

    <div class="context-dock-divider"></div>

    <!-- Grandezza -->
    <div class="context-dock-group" title="Dimensione testo">
      <span class="context-dock-label">Dim.</span>
      <button type="button" id="textSizeDecBtn" class="text-dock-btn" title="Riduci dimensione">A-</button>
      <select id="textSizeSelect" class="dock-select dock-select-compact">
        <option value="12">12</option>
        <option value="14">14</option>
        <option value="16">16</option>
        <option value="18" selected>18</option>
        <option value="20">20</option>
        <option value="24">24</option>
        <option value="28">28</option>
        <option value="32">32</option>
        <option value="36">36</option>
        <option value="48">48</option>
        <option value="60">60</option>
      </select>
      <button type="button" id="textSizeIncBtn" class="text-dock-btn" title="Aumenta dimensione">A+</button>
    </div>

    <div class="context-dock-divider"></div>

    <!-- Stile: Grassetto / Corsivo -->
    <div class="context-dock-group">
      <button type="button" id="textBoldBtn" class="text-dock-btn font-bold" title="Grassetto">B</button>
      <button type="button" id="textItalicBtn" class="text-dock-btn italic font-serif" title="Corsivo">I</button>
    </div>

    <div class="context-dock-divider"></div>

    <!-- Allineamento -->
    <div class="context-dock-group" title="Allineamento">
      <button type="button" class="text-dock-btn text-align-btn" data-align="left" title="Allinea a sinistra">
        <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="21" x2="3" y1="6" y2="6"/><line x1="15" x2="3" y1="12" y2="12"/><line x1="17" x2="3" y1="18" y2="18"/></svg>
      </button>
      <button type="button" class="text-dock-btn text-align-btn" data-align="center" title="Centra">
        <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="21" x2="3" y1="6" y2="6"/><line x1="17" x2="7" y1="12" y2="12"/><line x1="19" x2="5" y1="18" y2="18"/></svg>
      </button>
      <button type="button" class="text-dock-btn text-align-btn" data-align="right" title="Allinea a destra">
        <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="21" x2="3" y1="6" y2="6"/><line x1="21" x2="9" y1="12" y2="12"/><line x1="21" x2="7" y1="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div class="context-dock-row">
    <!-- Colore testo -->
    <div id="textColorPalette" class="context-dock-group">
      <span class="context-dock-label">Colore</span>
      <button type="button" class="text-color-swatch dock-swatch rounded-full bg-slate-900 dark:bg-slate-100 border-2 border-white dark:border-slate-800 ring-2 ring-indigo-500 scale-105" data-color="#000000" title="Nero"></button>
      <button type="button" class="text-color-swatch dock-swatch rounded-full bg-blue-600 border-2 border-white dark:border-slate-800" data-color="#2563eb" title="Blu"></button>
      <button type="button" class="text-color-swatch dock-swatch rounded-full bg-emerald-600 border-2 border-white dark:border-slate-800" data-color="#059669" title="Verde"></button>
      <button type="button" class="text-color-swatch dock-swatch rounded-full bg-rose-600 border-2 border-white dark:border-slate-800" data-color="#e11d48" title="Rosso"></button>
      <button type="button" class="text-color-swatch dock-swatch rounded-full bg-amber-500 border-2 border-white dark:border-slate-800" data-color="#d97706" title="Arancio"></button>
      <input type="color" id="textCustomColorPicker"
        class="dock-swatch rounded-full border-0 cursor-pointer p-0 bg-transparent"
        title="Colore testo personalizzato" value="#000000">
    </div>

    <div class="context-dock-divider"></div>

    <!-- Azioni casella selezionata -->
    <div class="context-dock-group">
      <button type="button" id="textEditBtn" class="text-dock-btn text-dock-action" disabled title="Modifica casella selezionata">
