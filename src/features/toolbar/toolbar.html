<!-- features/toolbar/toolbar.html
     Markup della feature toolbar v2 (mainbar + dock contestuali).
     Iniettato via `?raw` da toolbar.js tramite mountToolbar(). -->

<header id="mainHeader"
  class="bg-white/95 dark:bg-slate-900/95 border-b border-slate-300 dark:border-slate-800 px-2 py-2.5 flex items-center justify-between gap-2 z-30 shrink-0 shadow-sm transition-all duration-200">

  <!-- LEFT: back + titolo -->
  <div id="headerLeft" class="flex items-center space-x-2 shrink-0">
    <button id="backToLibraryBtn"
      class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-2 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
      title="Torna alla Libreria">
      📚 <span class="hidden xl:inline">Libreria</span>
    </button>
    <div class="h-4 w-px bg-slate-300 dark:bg-slate-700 shrink-0 hidden md:block"></div>
    <div class="min-w-0">
      <input type="text" id="docTitle" value="Appunti Surface Pen"
        class="font-semibold text-sm bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-indigo-500 rounded px-1.5 py-0.5 outline-none w-24 md:w-32 lg:w-auto" />
      <div class="text-[11px] text-slate-500 dark:text-slate-400 font-medium flex items-center gap-1.5">
        <span id="pageCounterText">Pagina 1 di 1</span>
        <span>•</span>
        <span id="statusBadge" class="text-indigo-600 dark:text-indigo-400 font-medium">Salvato</span>
      </div>
    </div>
  </div>

  <!-- CENTER: 5 menu contestuali -->
  <div id="mainMenuBar" class="flex-1 flex justify-center items-center min-w-0 gap-0.5 px-2">
    <button class="main-menu-btn" data-menu="writing"   id="menuBtn-writing"   title="Scrittura">
      🖊️<span class="main-menu-label">Scrittura</span>
    </button>
    <button class="main-menu-btn" data-menu="selection" id="menuBtn-selection" title="Selezione">
      ✂️<span class="main-menu-label">Selezione</span>
    </button>
    <button class="main-menu-btn" data-menu="shapes"    id="menuBtn-shapes"    title="Forme">
      ◻️<span class="main-menu-label">Forme</span>
    </button>
    <button class="main-menu-btn" data-menu="eraser"    id="menuBtn-eraser"    title="Gomma">
      🧹<span class="main-menu-label">Gomma</span>
    </button>
    <button class="main-menu-btn" data-menu="page"      id="menuBtn-page"      title="Foglio">
      📄<span class="main-menu-label">Foglio</span>
    </button>
  </div>

  <!-- RIGHT: azioni -->
  <div id="headerRight" class="relative z-10 flex items-center space-x-1 shrink-0">
    <button id="toolbarMenuBtn"
      class="dock-icon-btn inline-flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95"
      title="Altri strumenti">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
      </svg>
    </button>
    <button id="compactExitBtn"
      class="dock-icon-btn inline-flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95"
      title="Schermo intero">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path id="compactIconExpand" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25" />
        <path id="compactIconReduce" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9M20.25 20.25h-4.5m4.5 0v-4.5m0 4.5L15 15" style="display:none;" />
      </svg>
    </button>
    <button id="openSettingsBtnHeader"
      class="dock-icon-btn inline-flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95"
      title="Impostazioni">⚙️</button>
    <button id="themeToggleBtn"
      class="dock-icon-btn inline-flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-amber-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95"
      title="Tema chiaro/scuro">🌙</button>
    <button id="exportPdfBtn"
      class="dock-pill-btn inline-flex items-center bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 rounded-xl shadow-md transition active:scale-95"
      title="Esporta PDF">📄<span class="hidden lg:inline ml-1">PDF</span></button>
  </div>
</header>

<!-- ============================================================
     DOCK CONTESTUALI
     Uno per menu. Nascosti di default, mostrati da toolbar.js.
     ============================================================ -->

<!-- DOCK SCRITTURA -->
<div id="dockWriting" class="context-dock hidden" data-menu="writing">
  <div class="context-dock-row">
    <!-- Tool writing -->
    <div class="context-dock-group">
      <button id="btnTool-pen"
        class="dock-tool-btn tool-btn" title="Stilografica">🖊️</button>
      <button id="btnTool-pencil"
        class="dock-tool-btn tool-btn" title="Matita">✏️</button>
      <button id="btnTool-marker"
        class="dock-tool-btn tool-btn" title="Pennarello">🖋️</button>
      <button id="btnTool-highlighter"
        class="dock-tool-btn tool-btn" title="Evidenziatore">🖍️</button>
    </div>

    <div class="context-dock-divider"></div>

    <!-- Palette colori -->
    <div id="colorPalette" class="context-dock-group">
      <button class="color-swatch dock-swatch rounded-full bg-slate-900 dark:bg-slate-100 border-2 border-white dark:border-slate-800 ring-2 ring-indigo-500 scale-105" data-color="#000000" title="Nero"></button>
      <button class="color-swatch dock-swatch rounded-full bg-blue-600 border-2 border-white dark:border-slate-800" data-color="#2563eb" title="Blu"></button>
      <button class="color-swatch dock-swatch rounded-full bg-emerald-600 border-2 border-white dark:border-slate-800" data-color="#059669" title="Verde"></button>
      <button class="color-swatch dock-swatch rounded-full bg-rose-600 border-2 border-white dark:border-slate-800" data-color="#e11d48" title="Rosso"></button>
      <button class="color-swatch dock-swatch rounded-full bg-amber-500 border-2 border-white dark:border-slate-800" data-color="#d97706" title="Arancio"></button>
      <div id="recentColorsContainer" class="hidden items-center space-x-1"></div>
      <input type="color" id="customColorPicker"
        class="dock-swatch rounded-full border-0 cursor-pointer p-0 bg-transparent"
        title="Colore personalizzato">
    </div>
  </div>

  <div class="context-dock-row">
    <!-- Spessore -->
    <div class="context-dock-group" title="Spessore tratto">
      <span class="context-dock-label">Spessore</span>
      <input type="range" id="strokeWidthSlider" min="1" max="25" value="3"
        class="dock-range accent-indigo-600 cursor-pointer">
      <span id="strokeWidthValue"
        class="text-[10px] font-semibold text-slate-600 dark:text-slate-300 w-4 text-center tabular-nums">3</span>
    </div>

    <div class="context-dock-divider"></div>

    <!-- Opacità (apre il popover colore) -->
    <div class="context-dock-group" title="Opacità">
      <span class="context-dock-label">Opacità</span>
      <button id="opacityBtn"
        class="text-xs font-semibold text-slate-700 dark:text-slate-200 px-2 py-1 rounded-lg bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 transition">
        <span id="opacityValue">100%</span>
      </button>
    </div>

    <div class="context-dock-divider"></div>

    <!-- Smoothing -->
    <div class="context-dock-group" title="Levigatura del tratto">
      <span class="context-dock-label">Levigatura</span>
      <input type="range" id="smoothingSlider" min="0" max="100" value="50"
        class="dock-range accent-indigo-600 cursor-pointer">
      <span id="smoothingValue"
        class="text-[10px] font-semibold text-slate-600 dark:text-slate-300 w-4 text-center tabular-nums">50</span>
    </div>
  </div>
</div>

<!-- DOCK SELEZIONE (placeholder) -->
<div id="dockSelection" class="context-dock hidden" data-menu="selection">
  <div class="context-dock-row">
    <span class="text-xs text-slate-500 dark:text-slate-400 px-2 py-1">
      Seleziona tratti con il lazo. Le opzioni di modifica appariranno qui.
    </span>
  </div>
</div>

<!-- DOCK FORME -->
<div id="dockShapes" class="context-dock hidden" data-menu="shapes">
  <div class="context-dock-row">
    <label class="context-dock-toggle" title="Riconosce e raddrizza le linee">
      <input type="checkbox" id="snapLinesToggle" checked class="accent-indigo-600 w-4 h-4">
      <span>Linee dritte</span>
    </label>
    <div class="context-dock-divider"></div>
    <label class="context-dock-toggle" title="Riconosce cerchi, rettangoli, evidenziatore raddrizzato">
      <input type="checkbox" id="snapShapesToggle" checked class="accent-indigo-600 w-4 h-4">
      <span>Forme geometriche</span>
    </label>
  </div>
</div>

<!-- DOCK GOMMA -->
<div id="dockEraser" class="context-dock hidden" data-menu="eraser">
  <div class="context-dock-row">
    <span class="context-dock-label">Dimensione</span>
    <button class="eraser-level-btn" data-eraser-level="1" title="Piccola">
      <span style="width:6px;height:6px;"></span>
    </button>
    <button class="eraser-level-btn" data-eraser-level="2" title="Medio-piccola">
      <span style="width:11px;height:11px;"></span>
    </button>
    <button class="eraser-level-btn" data-eraser-level="3" title="Media">
      <span style="width:16px;height:16px;"></span>
    </button>
    <button class="eraser-level-btn" data-eraser-level="4" title="Medio-grande">
      <span style="width:21px;height:21px;"></span>
    </button>
    <button class="eraser-level-btn" data-eraser-level="5" title="Grande">
      <span style="width:26px;height:26px;"></span>
    </button>

    <div class="context-dock-divider"></div>

    <span class="context-dock-label">Modalità</span>
    <select id="eraserModeSelect"
      class="bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg px-2 py-1 text-xs font-medium">
      <option value="stroke">Tratto intero</option>
      <option value="point">Raggio puntuale</option>
    </select>
  </div>
</div>

<!-- POPOVER FOGLIO (non è un dock: one-shot, si chiude dopo la scelta) -->
<div id="pagePopover" class="hidden">
  <div class="page-popover-title">Foglio</div>

  <div class="page-popover-section">
    <label class="page-popover-label">Pattern</label>
    <div class="page-pattern-grid">
      <button class="page-pattern-btn" data-pattern="ruled"  title="A righe">Righe</button>
      <button class="page-pattern-btn" data-pattern="grid"   title="A quadretti">Griglia</button>
      <button class="page-pattern-btn" data-pattern="dots"   title="Puntinato">Punti</button>
      <button class="page-pattern-btn" data-pattern="blank"  title="Bianco">Bianco</button>
    </div>
  </div>

  <div class="page-popover-section" style="margin-top: 10px;">
    <label class="page-popover-label">Colori</label>
    <div class="page-colors-row">
      <label class="page-color-field" title="Colore del foglio">
        <span>Foglio</span>
        <input type="color" id="pagePaperColorInput" value="#ffffff">
      </label>
      <label class="page-color-field" title="Colore di linee / quadretti / punti">
        <span>Linee</span>
        <input type="color" id="pagePatternColorInput" value="#cbd5e1">
      </label>
    </div>
    <button id="pageColorsResetBtn"
      class="page-colors-reset"
      title="Ripristina i colori predefiniti del tema">
      ↺ Auto (segui tema)
    </button>
  </div>
</div>

<!-- ============================================================
     MENU ⋯ (azioni rare) — pannello con sezioni
     ============================================================ -->
<div id="toolbarMenuBackdrop" class="hidden fixed inset-0 bg-slate-900/20 dark:bg-slate-950/40 backdrop-blur-[1px] z-[45]"></div>
<div id="toolbarMenuPanel"
     class="hidden fixed bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 p-2 z-[46] flex flex-col gap-1 min-w-[240px]">

  <div class="menu-section">
    <div class="menu-section-title">Questo quaderno</div>
    <button id="addPageBtn" class="menu-item">➕ Nuova pagina</button>
    <button id="clearPageBtn" class="menu-item">🧹 Pulisci pagina</button>
  </div>

  <div class="menu-section">
    <div class="menu-section-title">Scrittura (globale)</div>
    <label class="menu-item menu-item-toggle">
      <input type="checkbox" id="palmRejectionCheck" class="accent-indigo-600 w-4 h-4">
      <span>Palm rejection</span>
    </label>
  </div>

  <div class="menu-section">
    <button id="openSettingsFromMenu" class="menu-item">⚙️ Impostazioni complete…</button>
  </div>
</div>

<!-- ============================================================
     POPOVER COLORE + OPACITÀ (invariato)
     ============================================================ -->
<div id="colorPickerPopover" class="fixed hidden z-[70] bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 p-3 w-64">
  <div class="flex items-center justify-between mb-2">
    <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">Colore & Opacità</span>
    <button id="closeColorPickerPopoverBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg leading-none w-6 h-6 flex items-center justify-center">×</button>
  </div>

  <div id="colorPickerPreview" class="w-full h-12 rounded-xl mb-3 border-2 border-slate-200 dark:border-slate-700 flex items-center justify-center text-xs font-medium" style="background-color: #000000;"></div>

  <div class="mb-3">
    <label class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1 block">Colore</label>
    <input type="color" id="popoverColorPicker" class="w-full h-9 rounded-lg cursor-pointer border border-slate-300 dark:border-slate-600 bg-transparent p-0">
  </div>

  <div class="mb-3">
    <label class="flex justify-between text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1">
      <span>Opacità</span>
      <span id="popoverOpacityValue" class="text-slate-700 dark:text-slate-300 tabular-nums">100%</span>
    </label>
    <input type="range" id="popoverOpacitySlider" min="10" max="100" value="100" class="w-full accent-indigo-600">
  </div>

  <div id="popoverHighlighterSwatches" class="hidden flex-wrap gap-1.5 pt-1 border-t border-slate-200 dark:border-slate-700">
    <button data-popover-color="#FFEB3B" class="w-6 h-6 rounded-full border-2 border-white dark:border-slate-800 shrink-0" style="background-color:#FFEB3B" title="Giallo"></button>
    <button data-popover-color="#7CFF7C" class="w-6 h-6 rounded-full border-2 border-white dark:border-slate-800 shrink-0" style="background-color:#7CFF7C" title="Verde"></button>
    <button data-popover-color="#FF7CBE" class="w-6 h-6 rounded-full border-2 border-white dark:border-slate-800 shrink-0" style="background-color:#FF7CBE" title="Rosa"></button>
    <button data-popover-color="#7CD4FF" class="w-6 h-6 rounded-full border-2 border-white dark:border-slate-800 shrink-0" style="background-color:#7CD4FF" title="Azzurro"></button>
    <button data-popover-color="#FFA97C" class="w-6 h-6 rounded-full border-2 border-white dark:border-slate-800 shrink-0" style="background-color:#FFA97C" title="Arancio"></button>
  </div>
</div>
