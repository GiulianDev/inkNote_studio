<!-- src/pages/notebook-page.html
     Markup della pagina Quaderno (toolbar mount, viewport canvas, barra flottante lazo,
     undo/redo e zoom badge). Iniettato via ?raw da src/pages/notebook-page.js. -->

    <!-- TOOLBAR (header + subbar + collapse/expand) -->
    <div id="toolbarMount"></div>

    <main id="viewport">
        <div id="canvasContainer"></div>
    </main>

    <div id="pullPageIndicator" class="fixed bottom-12 left-1/2 -translate-x-1/2 hidden bg-indigo-600 text-white dark:bg-indigo-500 backdrop-blur-md px-4 py-2 rounded-full shadow-2xl text-xs font-bold items-center gap-2 z-[44] border border-indigo-400/30 transition-all duration-200">
        <span id="pullIcon" class="inline-flex items-center justify-center shrink-0" aria-hidden="true">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        </span>
        <span id="pullText">Scorri in su per aggiungere una nuova pagina...</span>
    </div>

    <!-- Barra flottante selezione lazo -->
    <div id="selectionMenu" class="floating-selector-bar floating-selector-bar--lasso fixed hidden z-[42]" role="toolbar" aria-label="Azioni selezione">
        <div class="selector-bar-group">
            <label id="selectionColorControl" class="selector-color-control" title="Colore selezione">
                <input type="color" id="selectionColorPicker" value="#000000" class="selector-color-input" aria-label="Colore selezione">
            </label>

            <div class="selector-width-control" data-selection-ink-only title="Spessore tratti selezionati">
                <svg class="w-3.5 h-3.5 text-slate-400 dark:text-slate-500 shrink-0 pointer-events-none" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <circle cx="8" cy="8" r="3.5"/>
                </svg>
                <input type="range" id="selectionWidthSlider" min="1" max="25" value="3" class="selector-width-slider" aria-label="Spessore tratti selezionati">
                <span id="selectionWidthValue" class="selector-width-value">3</span>
            </div>

            <div class="flex items-center" data-selection-ink-only data-selection-style-only>
                <button id="selectionStyleBtn" type="button" class="selector-icon-btn selector-style-btn" title="Stile tratto selezionato" aria-label="Stile tratto selezionato" aria-haspopup="true" aria-expanded="false">
                    <span id="selectionStylePreview" class="selector-style-preview" aria-hidden="true">
                        <svg viewBox="0 0 32 12" fill="none">
                            <line id="selectionStylePreviewLine" x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <svg class="w-3 h-3 opacity-70 pointer-events-none shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
            </div>

            <div id="selectionFontSizeControl" class="selector-font-size-control hidden" data-selection-text-only title="Dimensione testo">
                <button id="selectionFontDecBtn" type="button" class="selector-icon-btn selector-font-step-btn" title="Riduci dimensione testo" aria-label="Riduci dimensione testo">A-</button>
                <span id="selectionFontSizeValue" class="selector-font-size-value">18px</span>
                <button id="selectionFontIncBtn" type="button" class="selector-icon-btn selector-font-step-btn" title="Aumenta dimensione testo" aria-label="Aumenta dimensione testo">A+</button>
            </div>

            <button id="selectionEditTextBtn" type="button" class="selector-icon-btn primary hidden" data-selection-single-text-only title="Modifica testo" aria-label="Modifica testo">
                <svg class="w-3.5 h-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                <span>Modifica</span>
            </button>
        </div>

        <div class="selector-bar-divider"></div>

        <div class="selector-bar-group">
            <button id="copySelectionBtn" type="button" class="selector-icon-btn" title="Copia selezione (Ctrl+C)" aria-label="Copia selezione">
                <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
            <button id="cutSelectionBtn" type="button" class="selector-icon-btn" title="Taglia selezione (Ctrl+X)" aria-label="Taglia selezione">
                <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg>
            </button>
            <button id="duplicateSelectionBtn" type="button" class="selector-icon-btn" title="Duplica selezione (Ctrl+D)" aria-label="Duplica selezione">
                <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/><path d="M15 12v6"/><path d="M12 15h6"/></svg>
            </button>
        </div>

        <div class="selector-bar-divider"></div>

        <div class="selector-bar-group">
            <button id="deleteSelectionBtn" type="button" class="selector-icon-btn danger" title="Elimina selezione" aria-label="Elimina selezione">
                <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
            </button>
            <button id="clearSelectionBtn" type="button" class="selector-icon-btn" title="Deseleziona" aria-label="Deseleziona">
                <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
    </div>

    <div id="selectionStylePopover" class="fixed hidden z-[56] ui-popover-surface p-1.5" role="dialog" aria-label="Stile tratto selezionato">
        <div class="flex items-center gap-1">
            <button type="button" class="ui-dock-btn ui-dock-btn--style selection-style-option" data-selection-style="solid" title="Solido" aria-label="Solido">
                <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
                    <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button type="button" class="ui-dock-btn ui-dock-btn--style selection-style-option" data-selection-style="dashed" title="Tratteggiato" aria-label="Tratteggiato">
                <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
                    <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
                </svg>
            </button>
            <button type="button" class="ui-dock-btn ui-dock-btn--style selection-style-option" data-selection-style="dashed-large" title="Tratteggio largo" aria-label="Tratteggio largo">
                <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
                    <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="9 5"/>
                </svg>
            </button>
            <button type="button" class="ui-dock-btn ui-dock-btn--style selection-style-option" data-selection-style="dotted" title="Punteggiato" aria-label="Punteggiato">
                <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
                    <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 5"/>
                </svg>
            </button>
            <button type="button" class="ui-dock-btn ui-dock-btn--style selection-style-option" data-selection-style="dash-dot" title="Tratto-punto" aria-label="Tratto-punto">
                <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
                    <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 3 0.1 3"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="undoRedoContainer" class="hud-undo-redo fixed flex items-center z-40" style="top: 140px; left: 16px;" role="toolbar" aria-label="Annulla e ripristina">
        <button id="undoBtn" type="button" aria-label="Annulla ultima azione" title="Annulla (Ctrl+Z)" class="hud-undo-redo-btn">
            <svg class="w-5 h-5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
        </button>
        <div class="hud-undo-redo-divider" aria-hidden="true"></div>
        <button id="redoBtn" type="button" aria-label="Ripristina azione annullata" title="Ripristina (Ctrl+Shift+Z / Ctrl+Y)" class="hud-undo-redo-btn">
            <svg class="w-5 h-5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg>
        </button>
    </div>

    <div id="zoomBadge" class="hud-zoom-bar fixed z-40 flex items-center" role="group" aria-label="Controlli zoom">
        <button id="zoomOutBtn" type="button" class="hud-zoom-btn" title="Riduci zoom (-)" aria-label="Riduci zoom">
            <svg class="w-3.5 h-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button id="resetZoomBtn" type="button" class="hud-zoom-pct" title="Ripristina zoom 100% (0)" aria-label="Ripristina zoom 100%">
            <span id="zoomText" class="tabular-nums">100%</span>
        </button>
        <button id="zoomInBtn" type="button" class="hud-zoom-btn" title="Aumenta zoom (+)" aria-label="Aumenta zoom">
            <svg class="w-3.5 h-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
    </div>
