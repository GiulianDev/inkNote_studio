name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/versione da usare (es. v0.1.0-dev)'
        required: true
        default: 'v0.1.0-dev'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test unitari
        run: find src -name '*.test.js' | sort | xargs npx --yes tsx --test

      - name: Build singlefile
        env:
          # Iniettate da GitHub Secrets → Vite le legge come import.meta.env.VITE_*
          # (Se non impostati, fallback automatico su firebase-applet-config.json se presente)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
        run: npm run build:singlefileoffline

      - name: Verifica output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ dist/index.html non trovato dopo il build"
            ls -la dist/ || true
            exit 1
          fi
          SIZE=$(stat -c%s "dist/index.html")
          echo "✅ dist/index.html presente (${SIZE} bytes)"
          if [ "$SIZE" -lt 50000 ]; then
            echo "⚠️  File troppo piccolo — singlefile non attivo nel mode?"
            exit 1
          fi
          if grep -qE '<script[^>]+src=' dist/index.html; then
            echo "❌ Trovati script esterni non inlinati in dist/index.html"
            exit 1
          fi
          echo "✅ Tutto il JavaScript è inlinato nel file singolo"

      - name: Verifica config Firebase nel bundle
        run: |
          # Sanity check: la apiKey deve essere presente nel file compilato
          # (via GitHub Secrets oppure via firebase-applet-config.json).
          # Non mostriamo il valore (solo l'esito), per non leakare i log.
          if grep -q 'AIza[0-9A-Za-z_-]\{20,\}' dist/index.html; then
            echo "✅ Firebase apiKey presente nel bundle"
          else
            echo "❌ Firebase apiKey NON presente nel bundle — verifica i secrets o firebase-applet-config.json"
            exit 1
          fi

      - name: Prepara asset
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          OUT="inknote-studio-${TAG}.html"
          mkdir -p release
          cp dist/index.html "release/${OUT}"
          echo "tag=${TAG}"  >> $GITHUB_OUTPUT
          echo "file=${OUT}" >> $GITHUB_OUTPUT
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inknote-html-${{ steps.prep.outputs.tag }}
          path: release/*.html
          retention-days: 30

      - name: Crea/aggiorna release + allega HTML
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: InkNote Studio ${{ steps.prep.outputs.tag }}
          body: |
            Build singlefile offline di InkNote Studio.

            **Download**: `${{ steps.prep.outputs.file }}` — file HTML autonomo, apri con doppio click.
            Per il salvataggio (IndexedDB) usa **Firefox**, oppure servilo via HTTP (es. `npx serve`).
          files: release/*.html
          draft: false
          prerelease: ${{ contains(steps.prep.outputs.tag, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
