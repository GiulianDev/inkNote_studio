<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=5.0">
    <title>InkNote Studio - Notebooks & iPad Notes</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/style.css">
</head>
<body class="h-screen flex flex-col select-none" data-dock-size="medium">

    <!-- VISTA 1: LIBRERIA -->
    <div id="libraryView" class="fixed inset-0 bg-slate-100 dark:bg-slate-950 z-50 overflow-y-auto p-6 md:p-10 flex flex-col">

    <!-- HEADER default (nascosto in selection mode) -->
    <div id="libraryHeader" class="max-w-6xl w-full mx-auto flex flex-col sm:flex-row items-center justify-between mb-8 pb-4 border-b border-slate-300 dark:border-slate-800 gap-4">
        <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white w-11 h-11 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/>
            </svg>
        </div>
        <div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">InkNote Library</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">I tuoi blocchetti salvati in locale</p>
        </div>
        </div>

        <div class="flex items-center gap-2">
        <button id="newNotebookBtn"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-4 py-2.5 rounded-xl shadow-md flex items-center gap-2 transition active:scale-95">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/><path d="M12 5v14"/>
            </svg>
            Nuovo Quaderno
        </button>
        <button id="importBackupBtn"
            class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 font-semibold text-xs px-4 py-2.5 rounded-xl transition active:scale-95 flex items-center gap-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" x2="12" y1="3" y2="15"/>
            </svg>
            Importa
        </button>

        <div class="w-px h-6 bg-slate-300 dark:bg-slate-700 mx-1"></div>

        <button id="openSettingsBtnLib"
            class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 w-10 h-10 rounded-xl transition active:scale-95 flex items-center justify-center"
            title="Impostazioni">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>

        <div class="relative" id="authContainer">
            <button id="authBtn"
            class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition active:scale-95 overflow-hidden border border-slate-300 dark:border-slate-700"
            title="Accedi">
            <span id="authBtnContent" class="text-base">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>
                </svg>
            </span>
            </button>
            <div id="authDropdown"
            class="hidden absolute right-0 top-full mt-2 w-56 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 z-[60] overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-800">
                <div class="flex items-center gap-3">
                <div id="authDropdownAvatar" class="w-10 h-10 rounded-full flex items-center justify-center overflow-hidden bg-indigo-500 text-white font-bold flex-shrink-0"></div>
                <div class="min-w-0">
                    <div id="authDropdownName" class="text-sm font-semibold text-slate-900 dark:text-white truncate"></div>
                    <div id="authDropdownEmail" class="text-[11px] text-slate-500 dark:text-slate-400 truncate"></div>
                </div>
                </div>
            </div>
            <button id="authLogoutBtn"
                class="w-full text-left px-4 py-2.5 text-xs font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition">
                Esci
            </button>
            </div>
        </div>
        </div>
    </div>

   <!-- BARRA SELEZIONE (sostituisce l'header in selection mode) -->
    <div id="librarySelectionBar"
        class="hidden max-w-6xl w-full mx-auto mb-8 pb-4 border-b border-slate-300 dark:border-slate-800 items-center justify-between gap-2 sm:gap-4">
        <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <button id="selectionDoneBtn"
            class="text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 w-10 h-10 rounded-xl transition active:scale-95 flex items-center justify-center shrink-0"
            title="Fine">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>
        </button>
        <span id="selectionCount" class="text-sm font-semibold text-slate-900 dark:text-white tabular-nums whitespace-nowrap truncate">0 selezionati</span>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="selectionSelectAllBtn"
            class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 font-semibold text-xs px-2.5 sm:px-3 py-2.5 rounded-xl transition active:scale-95 flex items-center gap-2"
            title="Seleziona tutto">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            <span class="hidden sm:inline">Tutto</span>
        </button>
        <button id="selectionDuplicateBtn"
            class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 font-semibold text-xs px-2.5 sm:px-3 py-2.5 rounded-xl transition active:scale-95 flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100"
            title="Duplica selezionati">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
            </svg>
            <span class="hidden sm:inline">Duplica</span>
        </button>
        <button id="selectionExportBtn"
            class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 font-semibold text-xs px-2.5 sm:px-3 py-2.5 rounded-xl transition active:scale-95 flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100"
            title="Esporta selezionati">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" x2="12" y1="15" y2="3"/>
            </svg>
            <span class="hidden sm:inline">Esporta</span>
        </button>
        <button id="selectionDeleteBtn"
            class="bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs px-2.5 sm:px-3 py-2.5 rounded-xl shadow-md transition active:scale-95 flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100"
            title="Elimina selezionati">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span class="hidden sm:inline">Elimina</span>
        </button>
        </div>
    </div>

    <div class="max-w-6xl w-full mx-auto flex-1">
        <div id="notebooksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5"></div>
        <div id="emptyLibraryMessage" class="hidden flex-col items-center justify-center py-20 text-center text-slate-400">
        <span class="text-5xl mb-3">📓</span>
        <p class="font-semibold text-base text-slate-600 dark:text-slate-300">Nessun quaderno presente</p>
        <p class="text-xs text-slate-500 mt-1">Clicca su "Nuovo Quaderno" per iniziare a prendere appunti.</p>
        </div>
    </div>
    </div>

    <!-- MODALE NUOVO QUADERNO -->
    <div id="newNotebookModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col" style="max-height: 90vh;">

            <div class="px-6 pt-6 pb-3 shrink-0">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">Crea Nuovo Quaderno</h3>
            </div>

            <div class="px-6 overflow-y-auto flex-1 custom-scrollbar" style="touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;">
                <div class="space-y-4 text-xs">
                    <div>
                        <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Titolo del Quaderno</label>
                        <input type="text" id="modalNbTitle" value="Appunti Personali" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Colore Copertina</label>
                        <div class="flex items-center space-x-2 pt-1 pb-3" id="coverColorOptions">
                            <button class="w-7 h-7 rounded-full bg-indigo-600 ring-2 ring-indigo-500 ring-offset-2 scale-110" data-color="#4f46e5"></button>
                            <button class="w-7 h-7 rounded-full bg-blue-600" data-color="#2563eb"></button>
                            <button class="w-7 h-7 rounded-full bg-emerald-600" data-color="#059669"></button>
                            <button class="w-7 h-7 rounded-full bg-rose-600" data-color="#e11d48"></button>
                            <button class="w-7 h-7 rounded-full bg-amber-500" data-color="#d97706"></button>
                            <button class="w-7 h-7 rounded-full bg-slate-800" data-color="#1e293b"></button>
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Pattern Fogli Iniziale</label>
                        <select id="modalNbPattern" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 outline-none font-medium">
                            <option value="ruled">A Righe</option>
                            <option value="grid">A Quadretti</option>
                            <option value="dots">Puntinato (Dot Grid)</option>
                            <option value="blank">Bianco Pulito</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-end space-x-2 px-6 py-4 border-t border-slate-200 dark:border-slate-800 shrink-0">
                <button id="cancelNewNbBtn" class="px-4 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs">Annulla</button>
                <button id="confirmCreateNbBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl shadow-md">Crea Quaderno</button>
            </div>
        </div>
    </div>

    <!-- TOOLBAR (header + subbar + collapse/expand) -->
    <div id="toolbarMount"></div>

    <main id="viewport">
        <div id="canvasContainer"></div>
    </main>

    <div id="pullPageIndicator" class="fixed bottom-12 left-1/2 -translate-x-1/2 hidden bg-indigo-600 text-white dark:bg-indigo-500 backdrop-blur-md px-4 py-2 rounded-full shadow-2xl text-xs font-bold items-center gap-2 z-50 border border-indigo-400/30 transition-all duration-200">
        <span id="pullIcon">⬆️</span>
        <span id="pullText">Scorri in su per aggiungere una nuova pagina...</span>
    </div>

    <!-- menu lazo -->
    <div id="selectionMenu" class="fixed hidden bg-slate-900/95 text-white dark:bg-slate-800/95 backdrop-blur-md px-3 py-2 rounded-2xl shadow-2xl text-xs font-semibold flex items-center gap-2.5 z-50 border border-slate-700/50">
        <div class="flex items-center gap-1.5">
            <span class="text-[10px] uppercase tracking-wide text-slate-400">Colore</span>
            <input type="color" id="selectionColorPicker" value="#000000" class="w-7 h-7 rounded-full border border-slate-600 cursor-pointer p-0 bg-transparent">
        </div>
        <div class="w-px h-6 bg-slate-700/60"></div>
        <div class="flex items-center gap-1.5">
            <span class="text-[10px] uppercase tracking-wide text-slate-400">Spessore</span>
            <input type="range" id="selectionWidthSlider" min="1" max="25" value="3" class="w-20 accent-indigo-500 cursor-pointer">
            <span id="selectionWidthValue" class="text-[10px] w-4 text-center tabular-nums">3</span>
        </div>
        <div class="w-px h-6 bg-slate-700/60"></div>
        <button id="deleteSelectionBtn" class="bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1.5 rounded-lg transition" title="Elimina selezione">🗑️</button>
        <button id="clearSelectionBtn" class="bg-slate-700 hover:bg-slate-600 text-white px-2 py-1.5 rounded-lg transition" title="Deseleziona">✕</button>
    </div>

    <div id="undoRedoContainer" class="fixed flex items-center gap-1.5 bg-slate-900/95 dark:bg-slate-600/95 backdrop-blur-lg p-2 rounded-2xl z-40 border border-slate-700/60 dark:border-slate-400/40 shadow-[0_12px_32px_-8px_rgba(15,23,42,0.45),0_4px_12px_-4px_rgba(15,23,42,0.25)] dark:shadow-[0_12px_32px_-8px_rgba(0,0,0,0.75),0_4px_12px_-4px_rgba(0,0,0,0.5)]" style="top: 140px; left: 16px;">
        <button id="undoBtn" aria-label="Annulla ultima azione" title="Annulla (Ctrl+Z)" class="group relative w-14 h-14 flex items-center justify-center rounded-xl text-slate-200 dark:text-slate-50 hover:text-white hover:bg-white/15 active:scale-95 active:bg-white/20 transition-all duration-150 disabled:text-slate-500 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-slate-500 disabled:active:scale-100 disabled:cursor-not-allowed">
            <svg class="w-7 h-7 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
        </button>
        <div class="w-px h-9 bg-white/15 dark:bg-white/25"></div>
        <button id="redoBtn" aria-label="Ripristina azione annullata" title="Ripristina (Ctrl+Shift+Z / Ctrl+Y)" class="group relative w-14 h-14 flex items-center justify-center rounded-xl text-slate-200 dark:text-slate-50 hover:text-white hover:bg-white/15 active:scale-95 active:bg-white/20 transition-all duration-150 disabled:text-slate-500 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-slate-500 disabled:active:scale-100 disabled:cursor-not-allowed">
            <svg class="w-7 h-7 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15l6-6m0 0l-6-6m6 6H9a6 6 0 000 12h3" /></svg>
        </button>
    </div>

    <div id="zoomBadge" class="fixed bottom-6 left-6 bg-slate-900/90 text-white dark:bg-slate-800/90 backdrop-blur-md px-3 py-1.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 z-40">
        🔍 Zoom: <span id="zoomText">100%</span>
        <button id="resetZoomBtn" class="ml-1 bg-slate-700 hover:bg-slate-600 text-white px-2 py-0.5 rounded-lg text-[10px]">Reset</button>
    </div>

    <div id="toastNotification" class="fixed top-24 right-6 bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center gap-2 transform translate-y-2 opacity-0 pointer-events-none transition-all duration-300 z-50 font-medium">
        <span id="toastIcon">ℹ️</span>
        <span id="toastMessage">Messaggio</span>
    </div>

    <input type="file" id="importFileInput" accept=".inknote,application/json,application/octet-stream" hidden>
    <script type="module" src="src/main.js"></script>
</body>
</html>
