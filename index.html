<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=5.0">
    <title>InkNote Studio - Notebooks & iPad Notes</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/style.css">
</head>
<body class="h-screen flex flex-col select-none" data-dock-size="medium">

    <!-- VISTA 1: LIBRERIA -->
    <div id="libraryView" class="fixed inset-0 bg-slate-100 dark:bg-slate-950 z-50 overflow-y-auto flex flex-col">

    <!-- BARRA SUPERIORE FISSA (unica barra con transizione fluida normale <-> selezione) -->
    <div id="libraryTopBarWrap" class="sticky top-0 z-30 w-full bg-slate-100/90 dark:bg-slate-950/90 backdrop-blur-md px-4 sm:px-6 md:px-10 pt-4 sm:pt-6 md:pt-8 transition-shadow">
        <div id="libraryHeader" class="max-w-6xl w-full mx-auto flex flex-col md:flex-row items-stretch md:items-center justify-between pb-4 border-b border-slate-300 dark:border-slate-800 gap-3.5 md:gap-4">
            <!-- Lato sinistro unico: icona brand <-> chiudi selezione + titolo/contatore -->
            <div class="flex items-center space-x-3 min-w-0 shrink-0">
                <button id="libraryLeadingBtn" type="button" tabindex="-1" aria-hidden="true">
                    <svg class="lib-leading-icon is-brand w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/>
                    </svg>
                    <svg class="lib-leading-icon is-close w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                    </svg>
                </button>

                <div id="libraryHeaderTitleGroup" class="lib-title-group min-w-0">
                    <h1 id="libraryHeaderTitle" class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tabular-nums truncate">InkNote Library</h1>
                    <p id="libraryHeaderSubtitle" class="text-xs text-slate-500 dark:text-slate-400 font-medium truncate">I tuoi blocchetti salvati in locale</p>
                </div>
            </div>

            <!-- Lato destro: unico slot con transizione scorrevole tra azioni normali e selezione -->
            <div id="libraryActionsSlot">
                <div class="lib-actions-layer is-normal">
                    <button id="newNotebookBtn" type="button" class="lib-bar-btn lib-bar-btn--primary" title="Nuovo Quaderno" aria-label="Nuovo Quaderno">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 12h14"/><path d="M12 5v14"/>
                        </svg>
                        <span><span class="hidden lg:inline">Nuovo </span>Quaderno</span>
                    </button>
                    <button id="newFolderBtn" type="button" class="lib-bar-btn lib-bar-btn--secondary" title="Nuova Raccolta" aria-label="Nuova Raccolta">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 7V5a2 2 0 0 1 2-2h4l2 2h4a2 2 0 0 1 2 2v1"/>
                            <rect width="18" height="14" x="3" y="7" rx="2.5"/>
                            <path d="M12 11v6"/><path d="M9 14h6"/>
                        </svg>
                        <span class="hidden lg:inline">Nuova Raccolta</span>
                    </button>
                    <button id="librarySelectBtn" type="button" class="lib-bar-btn lib-bar-btn--secondary" title="Seleziona quaderni o raccolte" aria-label="Seleziona quaderni o raccolte">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                        <span class="hidden xl:inline">Seleziona</span>
                    </button>
                    <button id="importBackupBtn" type="button" class="lib-bar-btn lib-bar-btn--secondary lg:!px-4" title="Importa backup" aria-label="Importa backup">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" x2="12" y1="15" y2="3"/>
                        </svg>
                        <span class="hidden lg:inline">Importa</span>
                    </button>

                    <div class="hidden sm:block w-px h-6 bg-slate-300 dark:bg-slate-700 mx-1"></div>

                    <button id="openSettingsBtnLib" type="button" class="lib-bar-btn lib-bar-btn--icon" title="Impostazioni" aria-label="Impostazioni">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>

                    <button id="libraryFullscreenBtn" type="button" class="lib-bar-btn lib-bar-btn--icon" title="Schermo intero" aria-label="Schermo intero" aria-pressed="false">
                        <svg id="libFullscreenIconExpand" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9M20.25 20.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/>
                        </svg>
                        <svg id="libFullscreenIconReduce" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
                            <path d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"/>
                        </svg>
                    </button>

                    <div class="relative shrink-0" id="authContainer">
                        <button id="authBtn"
                            class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition active:scale-95 overflow-hidden border border-slate-300 dark:border-slate-700"
                            title="Accedi" aria-label="Profilo o accedi">
                            <span id="authBtnContent" class="text-base">
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>
                                </svg>
                            </span>
                        </button>
                        <span id="authInboxBadge" class="hidden absolute -top-1 -right-1 min-w-[1.1rem] h-[1.1rem] px-1 rounded-full bg-rose-600 text-white text-[10px] font-bold leading-none items-center justify-center ring-2 ring-slate-100 dark:ring-slate-950 pointer-events-none" aria-hidden="true">0</span>
                    </div>
                </div>

                <div class="lib-actions-layer is-selection">
                    <button id="selectionSelectAllBtn" type="button" class="lib-bar-btn lib-bar-btn--secondary" title="Seleziona tutto" aria-label="Seleziona tutto">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                        <span class="hidden xl:inline">Tutto</span>
                    </button>
                    <button id="selectionMoveBtn" type="button" class="lib-bar-btn lib-bar-btn--secondary" title="Sposta nella raccolta" aria-label="Sposta nella raccolta">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 7V5a2 2 0 0 1 2-2h4l2 2h4a2 2 0 0 1 2 2v1"/>
                            <rect width="18" height="14" x="3" y="7" rx="2.5"/>
                            <path d="M8 14h8"/><path d="m13 11 3 3-3 3"/>
                        </svg>
                        <span class="hidden lg:inline">Sposta</span>
                    </button>
                    <button id="selectionDuplicateBtn" type="button" class="lib-bar-btn lib-bar-btn--secondary" title="Duplica selezionati" aria-label="Duplica selezionati">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                        </svg>
                        <span class="hidden lg:inline">Duplica</span>
                    </button>
                    <button id="selectionSendBtn" type="button" class="lib-bar-btn lib-bar-btn--secondary" title="Invia a un amico" aria-label="Invia a un amico">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
                            <path d="m21.854 2.147-10.94 10.939"/>
                        </svg>
                        <span class="hidden lg:inline">Invia</span>
                    </button>
                    <button id="selectionExportBtn" type="button" class="lib-bar-btn lib-bar-btn--secondary" title="Esporta selezionati" aria-label="Esporta selezionati">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" x2="12" y1="3" y2="15"/>
                        </svg>
                        <span class="hidden lg:inline">Esporta</span>
                    </button>
                    <button id="selectionDeleteBtn" type="button" class="lib-bar-btn lib-bar-btn--danger" title="Elimina selezionati" aria-label="Elimina selezionati">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            <line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>
                        </svg>
                        <span>Elimina</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="px-4 sm:px-6 md:px-10 pt-5 sm:pt-7 pb-6 sm:pb-10 flex-1 flex flex-col">
    <!-- BARRA CONTROLLI LIBRERIA: breadcrumb + cerca + preferiti + ordinamento + vista -->
    <div id="libraryControlsBar" class="max-w-6xl w-full mx-auto mb-5 flex flex-col gap-2.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
            <nav id="libraryBreadcrumbs" aria-label="Percorso raccolte" class="flex items-center flex-wrap gap-1 text-xs font-semibold text-slate-600 dark:text-slate-300"></nav>
            <span id="libraryItemsSummary" class="text-[11px] font-medium text-slate-500 dark:text-slate-400"></span>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2">
            <!-- Ricerca -->
            <div class="relative flex-1 min-w-[200px] sm:max-w-sm">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                </svg>
                <input id="librarySearchInput" type="search" placeholder="Cerca quaderni o raccolte..."
                    aria-label="Cerca quaderni o raccolte"
                    class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl pl-9 pr-8 py-2 text-xs font-medium text-slate-800 dark:text-slate-100 placeholder:text-slate-400 outline-none focus:ring-2 focus:ring-indigo-500 transition">
                <button id="librarySearchClearBtn" type="button" title="Cancella ricerca" aria-label="Cancella ricerca"
                    class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Filtro preferiti + ordinamento + vista Griglia/Lista -->
            <div class="flex items-center justify-between sm:justify-end gap-1.5 sm:gap-2 w-full sm:w-auto flex-nowrap">
                <button id="libraryFavFilterBtn" type="button"
                    class="bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 font-semibold text-xs px-2.5 sm:px-3 py-2 rounded-xl transition flex items-center gap-1 sm:gap-1.5 shrink-0"
                    title="Mostra solo i quaderni preferiti">
                    <svg class="w-3.5 h-3.5 fav-filter-star shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <span>Preferiti</span>
                </button>

                <div class="flex items-center bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl overflow-hidden min-w-0">
                    <div class="relative flex items-center min-w-0">
                        <select id="librarySortSelect" aria-label="Ordina libreria per"
                            class="appearance-none bg-white dark:bg-slate-900 text-xs font-semibold text-slate-700 dark:text-slate-200 pl-2.5 pr-6 sm:pl-3 sm:pr-8 py-2 outline-none cursor-pointer max-w-full truncate">
                            <option value="updatedAt">Ultima modifica</option>
                            <option value="createdAt">Data creazione</option>
                            <option value="title">Nome</option>
                            <option value="pageCount">N° pagine</option>
                        </select>
                        <svg class="w-3.5 h-3.5 text-slate-500 dark:text-slate-400 absolute right-2 sm:right-2.5 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </div>
                    <button id="librarySortDirBtn" type="button"
                        class="px-2 sm:px-2.5 py-2 border-l border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-center shrink-0"
                        title="Cambia ordine crescente/decrescente" aria-label="Inverti ordinamento">
                        <svg id="librarySortDirIcon" class="w-3.5 h-3.5 transition-transform duration-150" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </button>
                </div>

                <div class="flex items-center bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-0.5 shrink-0" role="group" aria-label="Modalità vista">
                    <button id="libraryViewGridBtn" type="button"
                        class="library-view-btn active px-2 py-1.5 rounded-lg transition flex items-center justify-center"
                        title="Vista Griglia" aria-label="Vista Griglia">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/>
                            <rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>
                        </svg>
                    </button>
                    <button id="libraryViewListBtn" type="button"
                        class="library-view-btn px-2 py-1.5 rounded-lg transition flex items-center justify-center"
                        title="Vista Lista" aria-label="Vista Lista">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/>
                            <line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-6xl w-full mx-auto flex-1">
        <div id="notebooksGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-4"></div>
        <div id="emptyLibraryMessage" class="hidden flex-col items-center justify-center py-20 text-center text-slate-400">
        <span id="emptyLibraryIcon" class="text-5xl mb-3">📓</span>
        <p id="emptyLibraryTitle" class="font-semibold text-base text-slate-600 dark:text-slate-300">Nessun quaderno presente</p>
        <p id="emptyLibrarySubtitle" class="text-xs text-slate-500 mt-1">Clicca su "Nuovo Quaderno" per iniziare a prendere appunti.</p>
        </div>
    </div>
    </div>
    </div>

    <!-- MODALE NUOVO QUADERNO -->
    <div id="newNotebookModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="newNotebookModalTitle">
        <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col" style="max-height: 90vh;">

            <div class="px-6 pt-6 pb-3 shrink-0">
                <h3 id="newNotebookModalTitle" class="text-lg font-bold text-slate-900 dark:text-white">Crea Nuovo Quaderno</h3>
            </div>

            <div class="px-6 overflow-y-auto flex-1 custom-scrollbar" style="touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;">
                <div class="space-y-4 text-xs">
                    <div>
                        <label for="modalNbTitle" class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Titolo del Quaderno</label>
                        <input type="text" id="modalNbTitle" value="Appunti Personali" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                    </div>
                    <div>
                        <span class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Colore Copertina</span>
                        <div class="flex items-center space-x-2 pt-1 pb-3" id="coverColorOptions">
                            <button class="w-7 h-7 rounded-full bg-indigo-600 ring-2 ring-indigo-500 ring-offset-2 scale-110" data-color="#4f46e5"></button>
                            <button class="w-7 h-7 rounded-full bg-blue-600" data-color="#2563eb"></button>
                            <button class="w-7 h-7 rounded-full bg-emerald-600" data-color="#059669"></button>
                            <button class="w-7 h-7 rounded-full bg-rose-600" data-color="#e11d48"></button>
                            <button class="w-7 h-7 rounded-full bg-amber-500" data-color="#d97706"></button>
                            <button class="w-7 h-7 rounded-full bg-slate-800" data-color="#1e293b"></button>
                        </div>
                    </div>
                    <div>
                        <label for="modalNbPattern" class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Pattern Fogli Iniziale</label>
                        <select id="modalNbPattern" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 outline-none font-medium">
                            <option value="ruled">A Righe</option>
                            <option value="grid">A Quadretti</option>
                            <option value="dots">Puntinato (Dot Grid)</option>
                            <option value="blank">Bianco Pulito</option>
                        </select>
                    </div>
                    <div>
                        <label for="modalNbFolder" class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Raccolta</label>
                        <select id="modalNbFolder" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 outline-none font-medium">
                            <option value="">Libreria (principale)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-end space-x-2 px-6 py-4 border-t border-slate-200 dark:border-slate-800 shrink-0">
                <button id="cancelNewNbBtn" class="px-4 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs">Annulla</button>
                <button id="confirmCreateNbBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl shadow-md">Crea Quaderno</button>
            </div>
        </div>
    </div>

    <!-- TOOLBAR (header + subbar + collapse/expand) -->
    <div id="toolbarMount"></div>

    <main id="viewport">
        <div id="canvasContainer"></div>
    </main>

    <div id="pullPageIndicator" class="fixed bottom-12 left-1/2 -translate-x-1/2 hidden bg-indigo-600 text-white dark:bg-indigo-500 backdrop-blur-md px-4 py-2 rounded-full shadow-2xl text-xs font-bold items-center gap-2 z-[44] border border-indigo-400/30 transition-all duration-200">
        <span id="pullIcon">⬆️</span>
        <span id="pullText">Scorri in su per aggiungere una nuova pagina...</span>
    </div>

    <!-- menu lazo -->
    <div id="selectionMenu" class="floating-selector-bar fixed hidden z-[25]">
        <div class="flex items-center gap-1.5 pl-1" data-selection-ink-only>
            <span class="selector-bar-label">Colore</span>
            <input type="color" id="selectionColorPicker" value="#000000" class="selector-color-input" title="Colore tratti selezionati">
        </div>
        <div class="selector-bar-divider" data-selection-ink-only></div>
        <div class="flex items-center gap-2" data-selection-ink-only>
            <span class="selector-bar-label">Spessore</span>
            <input type="range" id="selectionWidthSlider" min="1" max="25" value="3" class="w-20 accent-indigo-600 dark:accent-indigo-400 cursor-pointer">
            <span id="selectionWidthValue" class="text-[11px] w-4 text-center tabular-nums text-slate-600 dark:text-slate-300">3</span>
        </div>
        <div class="selector-bar-divider" data-selection-ink-only data-selection-style-only></div>
        <div class="flex items-center gap-1" data-selection-ink-only data-selection-style-only>
            <span class="selector-bar-label">Stile</span>
            <button id="selectionStyleBtn" type="button" class="selector-icon-btn selector-style-btn" title="Stile tratto selezionato" aria-label="Stile tratto selezionato" aria-haspopup="true" aria-expanded="false">
                <span id="selectionStylePreview" class="selector-style-preview" aria-hidden="true">
                    <svg viewBox="0 0 32 12" fill="none">
                        <line id="selectionStylePreviewLine" x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <svg class="w-3 h-3 opacity-70 pointer-events-none shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
        </div>
        <div class="selector-bar-divider" data-selection-ink-only></div>
        <button id="copySelectionBtn" type="button" class="selector-icon-btn" title="Copia selezione (Ctrl+C)" aria-label="Copia selezione">
            <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
        <button id="cutSelectionBtn" type="button" class="selector-icon-btn" title="Taglia selezione (Ctrl+X)" aria-label="Taglia selezione">
            <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg>
        </button>
        <button id="duplicateSelectionBtn" type="button" class="selector-icon-btn" title="Duplica selezione (Ctrl+D)" aria-label="Duplica selezione">
            <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/><path d="M15 12v6"/><path d="M12 15h6"/></svg>
        </button>
        <button id="deleteSelectionBtn" type="button" class="selector-icon-btn danger" title="Elimina selezione" aria-label="Elimina selezione">
            <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        </button>
        <button id="clearSelectionBtn" type="button" class="selector-icon-btn" title="Deseleziona" aria-label="Deseleziona">
            <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
    </div>

    <div id="selectionStylePopover" class="fixed hidden z-[56] ui-popover-surface p-1.5" role="dialog" aria-label="Stile tratto selezionato">
        <div class="flex items-center gap-1">
            <button type="button" class="ui-dock-btn ui-dock-btn--style selection-style-option" data-selection-style="solid" title="Solido" aria-label="Solido">
                <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
                    <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button type="button" class="ui-dock-btn ui-dock-btn--style selection-style-option" data-selection-style="dashed" title="Tratteggiato" aria-label="Tratteggiato">
                <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
                    <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
                </svg>
            </button>
            <button type="button" class="ui-dock-btn ui-dock-btn--style selection-style-option" data-selection-style="dashed-large" title="Tratteggio largo" aria-label="Tratteggio largo">
                <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
                    <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="9 5"/>
                </svg>
            </button>
            <button type="button" class="ui-dock-btn ui-dock-btn--style selection-style-option" data-selection-style="dotted" title="Punteggiato" aria-label="Punteggiato">
                <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
                    <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 5"/>
                </svg>
            </button>
            <button type="button" class="ui-dock-btn ui-dock-btn--style selection-style-option" data-selection-style="dash-dot" title="Tratto-punto" aria-label="Tratto-punto">
                <svg viewBox="0 0 32 12" fill="none" aria-hidden="true">
                    <line x1="2" y1="6" x2="30" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 3 0.1 3"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="undoRedoContainer" class="fixed flex items-center gap-1.5 bg-slate-900/95 dark:bg-slate-600/95 backdrop-blur-lg p-2 rounded-2xl z-40 border border-slate-700/60 dark:border-slate-400/40 shadow-[0_12px_32px_-8px_rgba(15,23,42,0.45),0_4px_12px_-4px_rgba(15,23,42,0.25)] dark:shadow-[0_12px_32px_-8px_rgba(0,0,0,0.75),0_4px_12px_-4px_rgba(0,0,0,0.5)]" style="top: 140px; left: 16px;">
        <button id="undoBtn" aria-label="Annulla ultima azione" title="Annulla (Ctrl+Z)" class="group relative w-14 h-14 flex items-center justify-center rounded-xl text-slate-200 dark:text-slate-50 hover:text-white hover:bg-white/15 active:scale-95 active:bg-white/20 transition-all duration-150 disabled:text-slate-500 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-slate-500 disabled:active:scale-100 disabled:cursor-not-allowed">
            <svg class="w-7 h-7 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
        </button>
        <div class="w-px h-9 bg-white/15 dark:bg-white/25"></div>
        <button id="redoBtn" aria-label="Ripristina azione annullata" title="Ripristina (Ctrl+Shift+Z / Ctrl+Y)" class="group relative w-14 h-14 flex items-center justify-center rounded-xl text-slate-200 dark:text-slate-50 hover:text-white hover:bg-white/15 active:scale-95 active:bg-white/20 transition-all duration-150 disabled:text-slate-500 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-slate-500 disabled:active:scale-100 disabled:cursor-not-allowed">
            <svg class="w-7 h-7 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15l6-6m0 0l-6-6m6 6H9a6 6 0 000 12h3" /></svg>
        </button>
    </div>

    <div id="zoomBadge" class="fixed bottom-6 left-6 bg-slate-900/90 text-white dark:bg-slate-800/90 backdrop-blur-md px-3 py-1.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 z-40">
        🔍 Zoom: <span id="zoomText">100%</span>
        <button id="resetZoomBtn" class="ml-1 bg-slate-700 hover:bg-slate-600 text-white px-2 py-0.5 rounded-lg text-[10px]">Reset</button>
    </div>

    <div id="toastNotification" role="status" aria-live="polite" class="fixed top-24 right-6 bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center gap-2 transform translate-y-2 opacity-0 pointer-events-none transition-all duration-300 z-[200] font-medium">
        <span id="toastIcon">ℹ️</span>
        <span id="toastMessage">Messaggio</span>
    </div>

    <input type="file" id="importFileInput" accept=".inknote,application/json,application/octet-stream" hidden>
    <script type="module" src="src/main.js"></script>
</body>
</html>
